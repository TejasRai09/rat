<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kotak → Estimation Updater</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Background animation */
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(-45deg, #667eea, #764ba2, #6b8dd6, #667eea);
      background-size: 400% 400%;
      animation: bgMove 12s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    @keyframes bgMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Glass card with animation */
    .card {
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      animation: fadeInUp 1s ease both;
    }

    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card h3 {
      color: #fff;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    label.form-label {
      color: #eee;
      font-weight: 500;
    }

    .form-control {
      background-color: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: none;
    }

    .form-control::file-selector-button {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .form-check-label {
      color: #f0f0f0;
    }

    .btn-primary {
      background-color: #ffffff;
      color: #5a67d8;
      font-weight: bold;
      border: none;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      background-color: #e2e8f0;
      transform: scale(1.03);
    }

    .alert {
      animation: fadeIn 0.6s ease-in-out both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .container {
      padding: 2rem;
    }

    .form-check-input:checked {
      background-color: #fff;
      border-color: #fff;
    }

    .form-check-input {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">
        <div class="card p-5">
          <h3 class="text-center">Reckoner Automation Tool (RAT)</h3>

          {% with messages=get_flashed_messages(with_categories=true) %}
            {% if messages %}
              {% for cat,msg in messages %}
                <div class="alert alert-{{cat}} alert-dismissible fade show">
                  {{msg}}
                  <button class="btn-close" data-bs-dismiss="alert"></button>
                </div>
              {% endfor %}
            {% endif %}
          {% endwith %}

          <form method="post" enctype="multipart/form-data">
            <div class="mb-4">
              <label class="form-label">Kotak Report (.xlsx)</label>
              <input class="form-control" type="file" name="kotak" required>
            </div>

            <div class="mb-4">
              <label class="form-label">Estimation Workbook (.xlsx)</label>
              <input class="form-control" type="file" name="estimation" required>
            </div>

            <div class="mb-4">
              <label class="form-label d-block mb-2">Which section?</label>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="section" value="equity" id="eq">
                <label class="form-check-label" for="eq">Equity only</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="section" value="debt" id="debt">
                <label class="form-check-label" for="debt">Debt only</label>
              </div>
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="section" value="both" id="both" checked>
                <label class="form-check-label" for="both">Both</label>
              </div>
            </div>

            <button class="btn btn-primary w-100 mt-2">Run Update</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
